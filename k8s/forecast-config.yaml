apiVersion: v1
kind: ConfigMap
metadata:
  name: forecast-config
data:
  # In-cluster Prometheus deployed by k8s/monitoring.yaml; leave blank to fall
  # back to a synthetic seasonal traffic series instead.
  PROMETHEUS_URL: "http://prometheus:9090"
  FORECAST_PORT: "5100"
  FORECAST_HISTORY_SECONDS: "21600"
  FORECAST_STEP_SECONDS: "60"
  FORECAST_HORIZON_STEPS: "5"
  FORECAST_REFRESH_SECONDS: "60"
  # Append one JSONL snapshot after every background forecast cycle. The file
  # is intended for later report analysis and is not used as a scaling input.
  REPORT_DATA_ENABLED: "true"
  REPORT_DATA_DIR: "/var/lib/forecast-data"
  REPORT_DATA_FILENAME: "forecast_metrics.jsonl"
  FORECAST_MIN_REPLICAS: "1"
  FORECAST_MAX_REPLICAS: "10"
  FORECAST_TARGET_RPS_PER_REPLICA: "20"
  # Queue-depth (in-flight requests) reactive safety net alongside the
  # forecast; the higher of the two signals wins each cycle.
  FORECAST_TARGET_ACTIVE_REQUESTS_PER_REPLICA: "5"

  # --- Vertical scaling (per-replica CPU/memory right-sizing) ---
  VERTICAL_SCALING_ENABLED: "true"
  SCALING_DEPLOYMENT_NAME: "student-api"
  SCALING_CONTAINER_NAME: "api"
  # Forecast peak usage * headroom = recommended request; limits are the
  # recommended request * limit multiplier. Bounds keep cost in check even if
  # the model mispredicts.
  VERTICAL_CPU_HEADROOM_RATIO: "1.3"
  VERTICAL_MEMORY_HEADROOM_RATIO: "1.3"
  VERTICAL_CPU_LIMIT_MULTIPLIER: "2.0"
  VERTICAL_MEMORY_LIMIT_MULTIPLIER: "2.0"
  VERTICAL_MIN_CPU_MILLICORES: "50"
  VERTICAL_MAX_CPU_MILLICORES: "1000"
  VERTICAL_MIN_MEMORY_MIB: "64"
  VERTICAL_MAX_MEMORY_MIB: "1024"
  # Only patch the Deployment (which triggers a rolling restart) if the
  # recommendation drifts by this ratio, and no more than once per cooldown.
  VERTICAL_CHANGE_THRESHOLD_RATIO: "0.2"
  VERTICAL_SCALE_COOLDOWN_SECONDS: "600"
