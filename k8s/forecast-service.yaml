apiVersion: v1
kind: Service
metadata:
  name: forecast-service
  labels:
    app: forecast-service
spec:
  type: ClusterIP
  selector:
    app: forecast-service
  ports:
    - name: http
      port: 5100
      targetPort: 5100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-service
  labels:
    app: forecast-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forecast-service
  template:
    metadata:
      labels:
        app: forecast-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5100"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: forecast-service
      automountServiceAccountToken: true
      containers:
        - name: forecast-service
          image: student-api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "forecast_service.py"]
          envFrom:
            - configMapRef:
                name: forecast-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 5100
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              # Bumped for the added CPU/memory ensemble models run each cycle.
              cpu: 150m
              memory: 384Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
              ephemeral-storage: 512Mi
