apiVersion: v1
kind: ConfigMap
metadata:
  name: student-app-config
data:
  # Consolidated SQL server template: routes states to mysql-1 through mysql-7 (4 state DBs per server)
  MYSQL_HOST_TEMPLATE: "mysql-{state}"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: students_db
  MYSQL_USER: root
  # Seed configuration: batch size per insert statement, max worker threads, and state batch size.
  # Seeding processes 4 states at a time (1 SQL server per batch with 4 workers) to prevent resource contention.
  STUDENT_BATCH_SIZE: "2000"
  STUDENT_SEED_WORKERS: "4"
  STUDENT_STATE_BATCH_SIZE: "4"
  API_HOST: 0.0.0.0
  API_PORT: "5000"
  JWT_ACCESS_TOKEN_EXPIRES_MINUTES: "60"
  # Used by the /dashboard and /api/scaling/status endpoints.
  PROMETHEUS_URL: "http://prometheus:9090"
  FORECAST_SERVICE_URL: "http://forecast-service:5100"
