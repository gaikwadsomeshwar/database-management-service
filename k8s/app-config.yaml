apiVersion: v1
kind: ConfigMap
metadata:
  name: student-app-config
data:
  # Distributed per-state SQL server template: resolves to mysql-maharashtra, mysql-karnataka, etc.
  MYSQL_HOST_TEMPLATE: "mysql-{state}"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: students_db
  MYSQL_USER: root
  # Seed configuration: batch size per insert statement, max worker threads, and state batch size.
  # Seeding processes 5 states at a time (with 5 workers) to prevent Minikube resource contention.
  STUDENT_BATCH_SIZE: "10000"
  STUDENT_SEED_WORKERS: "5"
  STUDENT_STATE_BATCH_SIZE: "5"
  API_HOST: 0.0.0.0
  API_PORT: "5000"
  JWT_ACCESS_TOKEN_EXPIRES_MINUTES: "60"
  # Used by the /dashboard and /api/scaling/status endpoints.
  PROMETHEUS_URL: "http://prometheus:9090"
  FORECAST_SERVICE_URL: "http://forecast-service:5100"
