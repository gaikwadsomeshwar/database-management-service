apiVersion: v1
kind: ConfigMap
metadata:
  name: student-app-config
data:
  # Distributed per-state SQL server template: resolves to mysql-maharashtra, mysql-karnataka, etc.
  MYSQL_HOST_TEMPLATE: "mysql-{state}"
  MYSQL_HOST: mysql-maharashtra
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: students_db
  MYSQL_USER: root
  # Tuned for the ~23.6M-row seed dataset: one worker per state SQL server (28
  # states) and larger batches to cut round trips; matches seed-job.yaml's
  # bumped CPU/memory so the extra parallelism can actually be used.
  STUDENT_BATCH_SIZE: "20000"
  STUDENT_SEED_WORKERS: "28"
  API_HOST: 0.0.0.0
  API_PORT: "5000"
  JWT_ACCESS_TOKEN_EXPIRES_MINUTES: "60"
  # Used by the /dashboard and /api/scaling/status endpoints.
  PROMETHEUS_URL: "http://prometheus:9090"
  FORECAST_SERVICE_URL: "http://forecast-service:5100"
