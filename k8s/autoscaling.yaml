# Baseline reactive autoscaler (CPU-threshold based), used in the dissertation as
# the control/comparison group against the proactive KEDA ScaledObject below.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: student-api-hpa-reactive
  labels:
    app: student-api
    scaling-mode: reactive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: student-api
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
---
# Proactive autoscaler driven by the forecasting service's predicted_replicas
# metric. Requires KEDA (https://keda.sh) with the Prometheus scaler installed,
# and Prometheus scraping forecast-service on port 5100. Disable the reactive
# HPA above when running this one, since both target the same Deployment.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: student-api-scaledobject-proactive
  labels:
    app: student-api
    scaling-mode: proactive
spec:
  scaleTargetRef:
    name: student-api
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 120
  pollingInterval: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        query: max(predicted_replicas{job="forecast-service"})
        threshold: "1"
        activationThreshold: "0"
