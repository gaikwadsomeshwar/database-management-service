# Copy this file to secret.yaml, replace every placeholder, and apply it.
# Keep secret.yaml out of version control.
apiVersion: v1
kind: Secret
metadata:
  name: student-app-secrets
type: Opaque
stringData:
  MYSQL_PASSWORD: replace-with-mysql-root-password
  API_USERNAME: api-user
  API_PASSWORD: replace-with-api-password
  JWT_SECRET_KEY: replace-with-a-long-random-jwt-secret
