# --- State: Andhra Pradesh (andhra_pradesh) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-andhra-pradesh
  labels:
    app: mysql
    state: andhra_pradesh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-andhra-pradesh
  labels:
    app: mysql
    state: andhra_pradesh
spec:
  type: ClusterIP
  selector:
    app: mysql
    state: andhra_pradesh
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-andhra-pradesh
  labels:
    app: mysql
    state: andhra_pradesh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
      state: andhra_pradesh
  template:
    metadata:
      labels:
        app: mysql
        state: andhra_pradesh
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:lts-oracle
          args:
            - --innodb-buffer-pool-size=64M
            - --max-connections=50
            - --innodb-redo-log-capacity=134217728
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: students_db
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-app-secrets
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 30m
              memory: 120Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data-andhra-pradesh
