# --- SQL Server: mysql-1 ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-1
  labels:
    app: mysql
    server: mysql-1
    app.kubernetes.io/component: mysql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-1
  labels:
    app: mysql
    server: mysql-1
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  selector:
    app: mysql
    server: mysql-1
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-1
  labels:
    app: mysql
    server: mysql-1
    app.kubernetes.io/component: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
      server: mysql-1
  template:
    metadata:
      labels:
        app: mysql
        server: mysql-1
        app.kubernetes.io/component: mysql
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:lts-oracle
          args:
            - --innodb-buffer-pool-size=96M
            - --max-connections=100
            - --innodb-redo-log-capacity=134217728
            - --max-allowed-packet=268435456
            - --net-read-timeout=600
            - --net-write-timeout=600
            - --wait-timeout=28800
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: students_db
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-app-secrets
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 60m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 800m
              memory: 896Mi
              ephemeral-storage: 2Gi


      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data-1
